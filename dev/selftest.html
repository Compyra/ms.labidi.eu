<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>selftest - ms.labidi.eu</title>
<style>
  body { font: 14px/1.5 Consolas, monospace; background: #0b0e14; color: #dbe2f0; padding: 16px; }
  .pass { color: #3fd68f; } .fail { color: #ff6b7a; } .pend { color: #ffc24b; }
  h2 { font-size: 15px; color: #4cc2ff; margin: 18px 0 4px; }
  #summary { font-weight: 700; font-size: 16px; margin-bottom: 12px; }
  iframe { width: 1px; height: 1px; opacity: 0; position: absolute; }
</style>
</head>
<body>
<div id="summary">running...</div>
<div id="out"></div>
<iframe id="app" src="../index.html"></iframe>
<script>
// Dev harness: load the real files with a per-run stamp so a cached copy can never
// produce a false failure.
(function () {
  var files = [
    "../data/data-commands-entra.js",
    "../data/data-commands-intune.js",
    "../data/data-commands-defender.js",
    "../data/data-commands-sentinel.js",
    "../data/data-commands-azure.js",
    "../data/data-commands-m365.js",
    "../data/data-commands-purview.js",
    "../data/data-commands-power.js",
    "../data/data-commands-windows.js",
    "../data/data-commands-automation.js",
    "../data/data-commands-licensing.js",
    "../data/data-commands-msp.js",
    "../data/data-commands-toolbox.js",
    "../data/data-commands-mypages.js",
    "../data/data-synonyms.js",
    "../data/data-registry.js",
    "../data/data-kql.js",
    "../data/data-ps.js",
    "../data/data-runbooks.js",
    "../data/data-meta.js",
    "../search.js"
  ];
  var stamp = "?t=" + Date.now();
  for (var i = 0; i < files.length; i++) {
    document.write('<script src="' + files[i] + stamp + '"><\/script>');
  }
})();
</script>
<script>
(function () {
  "use strict";
  var out = document.getElementById("out");
  var results = [];
  var section = "";

  function h2(name) {
    section = name;
    var el = document.createElement("h2");
    el.textContent = name;
    out.appendChild(el);
  }
  function report(status, name, detail) {
    results.push(status);
    var el = document.createElement("div");
    el.className = status;
    el.textContent = status.toUpperCase() + "  " + name + (detail ? "  :: " + detail : "");
    out.appendChild(el);
  }
  function t(name, fn) {
    try {
      var r = fn();
      if (r === "pend") { report("pend", name); }
      else if (r === false) { report("fail", name); }
      else { report("pass", name); }
    } catch (e) { report("fail", name, String(e).slice(0, 120)); }
  }
  function eq(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

  var HUB = window.MSHUB;
  HUB.buildIndex();
  HUB.setLicenseProfile([]);
  var ids = function (q) { return HUB.search(q).map(function (x) { return x.rec.id; }); };

  h2("[P1] data + resolver");
  t("record count matches meta", function () {
    return HUB.commands.length === HUB.meta.records && HUB.commands.length >= 380;
  });
  t("every command with url resolves via go", function () {
    return HUB.commands.filter(function (r) { return r.url; })
      .every(function (r) { return HUB.resolveGo(r.id) !== null; });
  });
  t("folded twin id resolves to sovereign url", function () {
    return HUB.resolveGo("defenderg").url === "https://security.microsoft.us";
  });
  t("alias resolves (adca -> enca)", function () {
    return HUB.resolveGo("adca").rec.id === "enca";
  });
  t("url-less concept returns null from resolveGo", function () {
    return HUB.resolveGo("air") === null;
  });

  h2("[P1] ranking");
  t("exact id first", function () { return ids("enca")[0] === "enca"; });
  t("synonym boost: air -> air concept + AIR records", function () {
    var r = ids("air").slice(0, 3);
    return r[0] === "air" && r.indexOf("deinvestigations") > 0;
  });
  t("boost requires all tokens (air xyzzy -> none)", function () {
    return ids("air xyzzy").length === 0;
  });
  t("subsequence fallback (watchlst)", function () {
    return ids("watchlst")[0] === "xdrwatchlist";
  });
  t("deprecated ranks under successor (microsoft entra)", function () {
    var r = ids("microsoft entra");
    return r.indexOf("en") < r.indexOf("azad");
  });
  t("filters: cat + kind + role", function () {
    return ids("cat:sentinel").length >= 18 &&
      ids("kind:setting").length >= 30 &&
      ids("role:caadmin").indexOf("enca") >= 0 &&
      ids("role:xdr-authset tamper")[0] === "tog-tamper";
  });

  h2("[P3] enrichment + license profile");
  t("registry shipped with names + bundles", function () {
    return HUB.registry.roles.caadmin === "Conditional Access Administrator" &&
      HUB.registry.licenses["m365-e5"].inc.indexOf("mdo-p2") >= 0;
  });
  t("coveredByProfile: direct + bundle + none", function () {
    HUB.setLicenseProfile(["mdo-p2"]);
    var direct = HUB.coveredByProfile("mdo-p2") && HUB.coveredByProfile("mdo-p1");
    HUB.setLicenseProfile(["m365-e5"]);
    var bundle = HUB.coveredByProfile("mdo-p2");
    HUB.setLicenseProfile([]);
    var none = !HUB.coveredByProfile("mdo-p2");
    return direct && bundle && none;
  });
  t("mypages carry shareText", function () {
    return HUB.commands.filter(function (r) { return r.category === "mypages"; })
      .every(function (r) { return r.shareText; });
  });
  t("settings seeds carry blastRadius", function () {
    var rec = HUB.commands.find(function (r) { return r.id === "set-sen-dailycap"; });
    return rec && rec.blastRadius === "high" && rec.kind === "setting";
  });

  h2("[P5-P7] future data (auto-activate)");
  function libStub(rows, min) {
    if (!rows) { return "pend"; }
    return rows.length >= min ? true : "pend";
  }
  t("phase 5 kql library", function () { return libStub(HUB.kql, 60); });
  t("phase 5 ps library", function () { return libStub(HUB.ps, 60); });
  t("phase 5 library rows complete", function () {
    if (!HUB.kql || !HUB.ps) { return "pend"; }
    var ids = {};
    HUB.commands.forEach(function (r) { ids[r.id] = 1; });
    var seen = {};
    return HUB.kql.concat(HUB.ps).every(function (r) {
      if (seen[r.id]) { return false; }
      seen[r.id] = 1;
      var keyed = r.table || r.module;
      return r.id && r.title && r.code && keyed &&
        (r.related || []).every(function (x) { return ids[x]; });
    });
  });
  t("phase 6 runbooks", function () { return libStub(HUB.runbooks, 25); });
  t("phase 7 licensing matrix", function () { return libStub(HUB.licensing, 80); });

  h2("[P5] library search + registry");
  t("library entries are searchable by title", function () {
    return ids("billable ingestion").indexOf("kql-usage-cost") >= 0;
  });
  t("library entries searchable by code content", function () {
    return ids("Revoke-MgUserSignInSession")[0] === "ps-revoke-sessions";
  });
  t("kind:kql and kind:ps filters work", function () {
    return ids("kind:kql").length === HUB.kql.length &&
      ids("kind:ps").length === HUB.ps.length;
  });
  t("library entries resolve as cards but not as go-links", function () {
    return HUB.getById("kql-usage-cost").kind === "kql" &&
      HUB.resolveGo("kql-usage-cost") === null;
  });
  t("libraryFor gives reverse cross-links", function () {
    var hits = HUB.libraryFor("enca").map(function (e) { return e.id; });
    return hits.indexOf("ps-ca-policies") >= 0;
  });
  t("cat: filter spans records and library", function () {
    var sentinel = ids("cat:sentinel");
    return sentinel.indexOf("senplaybookperms") >= 0 &&
      sentinel.indexOf("kql-usage-cost") >= 0;
  });
  t("filter-only searches are never truncated", function () {
    var expected = HUB.commands.filter(function (r) {
      return r.category === "defender";
    }).length + HUB.kql.concat(HUB.ps).concat(HUB.runbooks).filter(function (r) {
      return r.subject === "defender";
    }).length;
    return ids("cat:defender").length === expected && expected > 100;
  });
  t("every KQL table exists in the registry", function () {
    var known = {};
    (HUB.registry.tables || []).forEach(function (tb) { known[tb.name] = 1; });
    return HUB.kql.every(function (q) { return known[q.table]; });
  });
  t("table registry shipped", function () {
    return (HUB.registry.tables || []).length >= 45;
  });
  t("ps hints on records resolve to snippets", function () {
    var hinted = HUB.commands.filter(function (r) {
      return r.ps && /^(ps|kql)-/.test(r.ps);
    });
    return hinted.length >= 4 && hinted.every(function (r) {
      return !!HUB.getById(r.ps);
    });
  });

  h2("[P6] runbooks");
  t("runbook rows complete (sections + related resolve)", function () {
    var known = {};
    HUB.commands.concat(HUB.kql).concat(HUB.ps).forEach(function (r) { known[r.id] = 1; });
    return HUB.runbooks.length >= 25 && HUB.runbooks.every(function (r) {
      return /^rb-/.test(r.id) && r.title && r.level && r.subject &&
        (r.steps || []).length >= 4 && (r.verify || []).length &&
        (r.escalate || []).length &&
        (r.related || []).every(function (x) { return known[x] || /^rb-/.test(x); });
    });
  });
  t("runbooks searchable, kind:runbook filter, no go-link", function () {
    return ids("kind:runbook").length === HUB.runbooks.length &&
      ids("apns certificate").indexOf("rb-apns-expired") >= 0 &&
      HUB.getById("rb-mail-not-arriving").kind === "runbook" &&
      HUB.resolveGo("rb-mail-not-arriving") === null;
  });
  t("runbooksFor gives reverse cross-links", function () {
    var hits = HUB.runbooksFor("exmt").map(function (e) { return e.id; });
    return hits.indexOf("rb-mail-not-arriving") >= 0;
  });
  t("runbook levels are valid and spread", function () {
    var levels = {};
    HUB.runbooks.forEach(function (r) { levels[r.level] = 1; });
    return HUB.runbooks.every(function (r) {
      return ["L1", "L2", "L3"].indexOf(r.level) >= 0;
    }) && levels.L1 && levels.L2;
  });

  h2("[P2/P3] app e2e (iframe)");
  var frame = document.getElementById("app");

  function frameReady() {
    return new Promise(function (res) {
      (function poll() {
        var w = frame.contentWindow;
        if (w && w.MSHUB && w.MSHUB.getById &&
            w.document.querySelector(".tiles, #listbox, .card")) { res(w); }
        else { setTimeout(poll, 150); }
      })();
    });
  }
  function settle(w, selector) {
    return until(w, function () { return !!w.document.querySelector(selector); });
  }

  function until(w, fn) {
    return new Promise(function (res) {
      (function poll(n) {
        var ok = false;
        try { ok = fn(); } catch (e) { ok = false; }
        if (ok || n > 60) { res(); }
        else { setTimeout(function () { poll(n + 1); }, 100); }
      })(0);
    });
  }

  function titled(w, prefix) {
    return until(w, function () { return w.document.title.indexOf(prefix) === 0; });
  }

  frameReady().then(function (w) {
    function type(q) {
      var input = w.document.getElementById("q");
      input.value = q;
      input.dispatchEvent(new w.Event("input", { bubbles: true }));
    }
    var steps = [
      function () {
        t("home renders 14 subject tiles + 4 library tiles", function () {
          return w.document.querySelectorAll(".tiles:not(.libtiles) .tile").length === 14 &&
            w.document.querySelectorAll(".libtiles .tile").length === 4;
        });
        t("aria-controls absent on home", function () {
          return w.document.getElementById("q").getAttribute("aria-controls") === null;
        });
        type("pim");
        t("results in listbox with option roles", function () {
          var rows = w.document.querySelectorAll("#listbox .row");
          return rows.length > 3 && rows[0].getAttribute("role") === "option" &&
            w.document.getElementById("q").getAttribute("aria-controls") === "listbox";
        });
        t("high blast badge in rows", function () {
          type("daily cap");
          return !!w.document.querySelector("#listbox .badge.blast-high");
        });
        w.location.hash = "#/c/enca";
        return titled(w, "enca -");
      },
      function () {
        t("card renders role + license names", function () {
          var dds = Array.prototype.map.call(
            w.document.querySelectorAll(".meta dd"),
            function (d) { return d.textContent; }).join("|");
          return dds.indexOf("Conditional Access Administrator") >= 0 &&
            dds.indexOf("Microsoft Entra ID P1") >= 0;
        });
        t("card title pattern", function () {
          return w.document.title.indexOf("enca - Conditional Access") === 0;
        });
        w.location.hash = "#/c/exmt";
        return titled(w, "exmt -");
      },
      function () {
        t("ps hint renders as a link to the snippet card", function () {
          var link = w.document.querySelector('.meta a[href="#/c/ps-message-trace"]');
          return !!link && link.textContent === "ps-message-trace";
        });
        w.location.hash = "#/s/sentinel";
        return titled(w, "Sentinel |");
      },
      function () {
        t("hub grouped without option roles", function () {
          return w.document.querySelectorAll("#results .row").length >= 18 &&
            !w.document.querySelector("[role=option]");
        });
        t("license profile badge end-to-end", function () {
          w.localStorage.setItem("mshub-lic", JSON.stringify(["mdo-p2"]));
          w.MSHUB.setLicenseProfile(["mdo-p2"]);
          type("air");
          var badges = w.document.querySelectorAll("#listbox .badge.inc").length;
          w.localStorage.removeItem("mshub-lic");
          w.MSHUB.setLicenseProfile([]);
          return badges >= 2;
        });
        t("shift+enter copies code for library results", function () {
          var captured = null;
          var orig = w.navigator.clipboard.writeText.bind(w.navigator.clipboard);
          try {
            w.navigator.clipboard.writeText = function (text) {
              captured = text;
              return Promise.resolve();
            };
            type("kql-usage-cost");
            var input = w.document.getElementById("q");
            input.dispatchEvent(new w.KeyboardEvent("keydown",
              { key: "Enter", shiftKey: true, bubbles: true }));
          } finally {
            w.navigator.clipboard.writeText = orig;
          }
          return captured !== null && captured.indexOf("Usage") === 0;
        });
        w.location.hash = "#/kql";
        return titled(w, "KQL library");
      },
      function () {
        t("kql view lists every query grouped by subject", function () {
          return w.document.querySelectorAll("#results .row").length === w.MSHUB.kql.length &&
            w.document.querySelectorAll(".gname").length > 3;
        });
        w.location.hash = "#/ps";
        return titled(w, "PowerShell library");
      },
      function () {
        t("ps view lists every snippet", function () {
          return w.document.querySelectorAll("#results .row").length === w.MSHUB.ps.length;
        });
        w.location.hash = "#/tables";
        return titled(w, "KQL tables");
      },
      function () {
        t("tables view renders the registry with query counts", function () {
          var rows = w.document.querySelectorAll(".tbl tbody tr").length;
          return rows === w.MSHUB.registry.tables.length &&
            w.document.querySelectorAll(".tbl tbody a").length > 5;
        });
        t("tables view cannot overflow the page", function () {
          var wrap = w.document.querySelector(".tblwrap");
          return wrap && w.getComputedStyle(wrap).overflowX === "auto";
        });
        w.location.hash = "#/c/kql-usage-cost";
        return titled(w, "kql-usage-cost");
      },
      function () {
        t("library card shows code, table and copy action", function () {
          var code = w.document.querySelector("pre.code code").textContent;
          var dts = Array.prototype.map.call(w.document.querySelectorAll(".meta dt"),
            function (d) { return d.textContent; });
          return code.indexOf("Usage") === 0 && dts.indexOf("Table") >= 0 &&
            w.document.querySelector(".actions .btn").textContent.indexOf("Copy KQL") === 0;
        });
        w.location.hash = "#/c/enca";
        return until(w, function () {
          return w.document.title.indexOf("enca -") === 0 &&
            !!w.document.querySelector(".cardlib");
        });
      },
      function () {
        t("record card cross-links its snippets", function () {
          var rows = w.document.querySelectorAll(".cardlib .row").length;
          return rows >= 3 &&
            w.document.querySelector(".cardlib .gname").textContent.indexOf("Queries") === 0;
        });
        w.location.hash = "#/runbooks";
        return titled(w, "Runbooks |");
      },
      function () {
        t("runbooks view lists every runbook grouped by subject", function () {
          return w.document.querySelectorAll("#results .row").length ===
            w.MSHUB.runbooks.length &&
            w.document.querySelectorAll("#results .badge.lvl").length ===
            w.MSHUB.runbooks.length;
        });
        w.location.hash = "#/c/rb-mail-not-arriving";
        return titled(w, "rb-mail-not-arriving");
      },
      function () {
        t("runbook card renders numbered steps + level badge + sections", function () {
          var heads = Array.prototype.map.call(
            w.document.querySelectorAll(".card.runbook .gname"),
            function (x) { return x.textContent; }).join("|");
          return w.document.querySelectorAll(".card.runbook ol.rbsec li").length >= 4 &&
            heads.indexOf("Steps") >= 0 && heads.indexOf("Verify") >= 0 &&
            heads.indexOf("Escalate when") >= 0 &&
            !!w.document.querySelector(".card-head .badge.lvl") &&
            w.document.querySelector(".actions .btn").textContent === "Copy steps";
        });
        w.location.hash = "#/c/exmt";
        return until(w, function () {
          return w.document.title.indexOf("exmt -") === 0 &&
            !!w.document.querySelector(".cardrbs");
        });
      },
      function () {
        t("record card cross-links its runbooks", function () {
          var links = Array.prototype.map.call(
            w.document.querySelectorAll(".cardrbs .row .rid"),
            function (x) { return x.textContent; });
          return links.indexOf("rb-mail-not-arriving") >= 0;
        });
        w.location.hash = "";
        return until(w, function () {
          return !!w.document.querySelector(".libtiles .tile");
        });
      },
      function () {
        t("library tiles link to both libraries and the table registry", function () {
          var hrefs = Array.prototype.map.call(
            w.document.querySelectorAll(".libtiles .tile"),
            function (a) { return a.getAttribute("href"); });
          return hrefs.join(",") === "#/kql,#/ps,#/runbooks,#/tables";
        });
        w.location.hash = "#q=100%";
        return until(w, function () {
          return w.document.getElementById("q").value === "100%";
        });
      },
      function () {
        t("malformed hash does not crash router", function () {
          return w.document.getElementById("q").value === "100%";
        });
        t("phase 8 pending: og:image", function () {
          return w.document.querySelector('meta[property="og:image"]') ? true : "pend";
        });
      }
    ];
    return steps.reduce(function (p, step) {
      return p.then(step);
    }, Promise.resolve());
  }).then(finish).catch(function (e) {
    report("fail", "e2e harness", String(e).slice(0, 160));
    finish();
  });

  function finish() {
    var fails = results.filter(function (r) { return r === "fail"; }).length;
    var pends = results.filter(function (r) { return r === "pend"; }).length;
    var passes = results.filter(function (r) { return r === "pass"; }).length;
    var el = document.getElementById("summary");
    el.className = fails ? "fail" : "pass";
    el.textContent = fails
      ? "SELFTEST: " + fails + " FAILURES (" + passes + " pass, " + pends + " pending)"
      : "SELFTEST: ALL PASS (" + passes + " pass, " + pends + " pending)";
  }
})();
</script>
</body>
</html>
